# ============================================================
# GoldNest — AWS notes
# ------------------------------------------------------------
# There is intentionally NO rate-refresh Lambda anymore.
#
# Live gold/silver rates are fetched directly in the browser from the
# GoldNest API (https://goldsnest.com/api/...), the same source the
# mobile app uses. Nothing server-side needs to run to keep rates fresh —
# no Lambda, no EventBridge schedule, no rates.json to write.
#
# Deploying the site is therefore just static hosting:
#   S3 (private) + CloudFront, with /api/* routed to the existing
#   goldsnest.com backend for the contact/enquiry forms.
#
# See README.md in this folder for the full, current deploy steps.
# ============================================================
